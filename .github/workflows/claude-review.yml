# Claude PR review — an independent reviewer that checks the change
# against PRINCIPLES.md, the specs and the glossary. The brief is
# .github/pr-review.md. Findings are advisory comments; the job fails
# only if the review itself can't run.
#
# Auth: Claude subscription token in the CLAUDE_CODE_OAUTH_TOKEN repo
# secret (generate with `claude setup-token`). Needs the Claude GitHub
# App installed on the repo.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo PRs only. Fork PRs carry untrusted content and get no
    # secrets; never switch this trigger to pull_request_target.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following .github/pr-review.md.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
