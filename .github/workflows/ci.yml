name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      # Build in topological order (root's `build` script).
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test all workspaces
        run: npm test -ws --if-present
