name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      # Contracts is a topological root; build it first so downstream
      # packages have its dist available before their own tsc runs.
      - name: Build contracts
        run: npm run build -w @synesthetica/contracts
      - name: Build remaining workspaces
        run: npm run build -ws --if-present
      - name: Lint
        run: npm run lint
      - name: Test all workspaces
        run: npm test -ws --if-present
