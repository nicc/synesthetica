# CI — runs the full quality gate on every pull request and every
# push to main. Same commands used locally (npm run build /
# typecheck / test / lint), so a green CI run means "this is what a
# fresh clone looks like".
#
# Kept lean: one job, one Node version (see Setup Node below). If we
# ever need to add a Windows / macOS check, a Node 20 lane for the
# CLI's engines floor, or a newer-Node lane, matrix it here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same
# PR / branch — avoids paying twice for the same tree.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build + test + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Current active Node LTS. Engines floor in
          # packages/cli/package.json is ">=20"; we pick a version >=
          # that but which is still supported by GitHub Actions
          # runners (Node 20 was deprecated on GHA 2025-09-19).
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        # Package builds type-check src for contracts / adapters /
        # engine / cli. This covers what they don't: the web-app
        # (vite build doesn't type-check) and every package's tests.
        run: npm run typecheck

      - name: Test
        # One vitest run across every package (vitest.workspace.ts).
        run: npm test

      - name: Lint
        run: npm run lint

      - name: MCP smoke — bundled CLI accepts initialize
        # Runs the freshly-built dist/bin.js and sends a real MCP
        # initialize request. Guards against the class of failure
        # where the tarball inspects cleanly (dry-run) but the
        # bundled binary blows up at startup (as 1.0.0 did with
        # a stale prompt-resolver path).
        run: npm run smoke -w synesthetica
