<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Synesthetica favicon: a three-armed chord-shape mark modelled on
    a screenshot from the harmony lens. Cyan/teal hub with three
    triangular arms in the app's pitch-class hues — teal at top,
    magenta bottom-right, gold-orange bottom-left.
  -->
  <!-- Arms drawn first so the hub sits cleanly on top of their bases. -->
  <polygon points="14,9 18,9 16,2" fill="hsl(180, 65%, 55%)"/>
  <polygon points="22.36,19.54 19.54,22.36 25.9,25.9" fill="hsl(300, 55%, 55%)"/>
  <polygon points="10.94,21.23 8.94,17.77 3.88,23" fill="hsl(35, 75%, 50%)"/>
  <circle cx="16" cy="16" r="7" fill="hsl(180, 45%, 32%)"/>
</svg>
