<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synesthetica</title>
  <style>
    /* -----------------------------------------------------------------
     * Reset + surface
     * ----------------------------------------------------------------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #ddd;
      overflow: hidden;
    }
    #canvas { display: block; width: 100vw; height: 100vh; }

    /* -----------------------------------------------------------------
     * Panel toolbar (top-right)
     * ----------------------------------------------------------------- */
    .syn-panel-toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      gap: 6px;
    }
    .syn-panel-tab {
      background: rgba(20, 20, 20, 0.7);
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background 120ms, color 120ms;
    }
    .syn-panel-tab:hover { background: rgba(40, 40, 40, 0.85); color: #ddd; }
    .syn-panel-tab.open {
      background: rgba(80, 80, 80, 0.9);
      color: #fff;
      border-color: #555;
    }

    /* -----------------------------------------------------------------
     * Panel overlay + frame
     * ----------------------------------------------------------------- */
    .syn-panel-overlay {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .syn-panel-overlay[hidden] { display: none; }
    .syn-panel-host {
      max-width: 480px;
      width: min(480px, 90vw);
      max-height: 80vh;
      display: flex;
    }
    .syn-panel-frame {
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
    }
    .syn-panel-frame-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      background: rgba(30, 30, 30, 0.4);
    }
    .syn-panel-frame-title {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .syn-panel-frame-close {
      background: transparent;
      color: #888;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }
    .syn-panel-frame-close:hover { color: #eee; }
    .syn-panel-frame-body {
      padding: 14px;
      overflow-y: auto;
    }
    .syn-panel-placeholder {
      padding: 20px;
      color: #666;
      font-size: 12px;
      text-align: center;
    }

    /* -----------------------------------------------------------------
     * Widgets (rendered by renderPanel)
     * ----------------------------------------------------------------- */
    .syn-panel-section { margin-bottom: 14px; }
    .syn-panel-section:last-child { margin-bottom: 0; }
    .syn-panel-section-title {
      font-size: 10px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #202020;
    }
    .syn-panel-subgroup { margin: 10px 0 10px 6px; }
    .syn-panel-subgroup-title {
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .syn-panel-widget {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      column-gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .syn-panel-widget-label {
      font-size: 11px;
      color: #999;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .syn-panel-widget-value {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      color: #777;
      min-width: 42px;
      text-align: right;
    }
    .syn-panel-widget-hints {
      grid-column: 1 / -1;
      font-size: 9px;
      color: #444;
      margin-top: -4px;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* Range sliders — desaturated, ash-toned, to match the surface.
     * Explicit selectors for both WebKit and Firefox so neither
     * browser leaks its default blue accent through. */
    .syn-panel-widget input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: transparent;
      outline: none;
    }
    .syn-panel-widget input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
    }
    .syn-panel-widget input[type="range"]::-moz-range-track {
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      border: none;
    }
    .syn-panel-widget input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      background: #888;
      border-radius: 50%;
      cursor: pointer;
      margin-top: -4px; /* re-centre on the 4px track */
    }
    .syn-panel-widget input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      background: #888;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }
    .syn-panel-widget input[type="range"]:hover::-webkit-slider-thumb,
    .syn-panel-widget input[type="range"]:hover::-moz-range-thumb {
      background: #b0b0b0;
    }
    .syn-panel-widget select,
    .syn-panel-widget input[type="number"] {
      width: 100%;
      background: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 4px 6px;
      font-size: 11px;
      font-family: inherit;
    }
    .syn-panel-widget select:disabled { color: #555; }
    .syn-panel-widget input[type="checkbox"] {
      accent-color: #888;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .syn-panel-widget-clear {
      background: #222;
      color: #888;
      border: 1px solid #333;
      border-radius: 3px;
      padding: 3px 7px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
    }
    .syn-panel-widget-clear:hover { background: #2a2a2a; color: #ccc; }
    .syn-panel-widget-unit { font-size: 10px; color: #666; }
    .syn-panel-widget-pair { grid-template-columns: 1fr; }
    .syn-panel-widget-pair-children {
      display: grid;
      gap: 6px;
      padding-left: 8px;
    }

    /* -----------------------------------------------------------------
     * About panel body (rendered from system-overview.md)
     * ----------------------------------------------------------------- */
    .syn-about {
      font-size: 13px;
      line-height: 1.55;
      color: #ccc;
    }
    .syn-about h1 { font-size: 15px; color: #fff; margin: 0 0 8px; }
    .syn-about h2 {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 6px;
    }
    .syn-about h3 {
      font-size: 12px;
      color: #bbb;
      margin: 10px 0 4px;
    }
    .syn-about p { margin: 0 0 8px; }
    .syn-about ul { margin: 0 0 8px 20px; }
    .syn-about li { margin-bottom: 4px; }
    .syn-about hr {
      border: none;
      border-top: 1px solid #222;
      margin: 12px 0;
    }
    .syn-about code {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      background: #1a1a1a;
      color: #ddd;
      padding: 1px 4px;
      border-radius: 2px;
    }
    .syn-about pre {
      background: #111;
      border: 1px solid #222;
      border-radius: 3px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11px;
      color: #bbb;
      overflow-x: auto;
      margin: 0 0 8px;
    }
    .syn-about table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 8px;
      font-size: 12px;
    }
    .syn-about th, .syn-about td {
      border-bottom: 1px solid #222;
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }
    .syn-about th { color: #888; font-weight: normal; }

    /* -----------------------------------------------------------------
     * Session status line (bottom-left)
     * ----------------------------------------------------------------- */
    .syn-status {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 5;
      font-size: 10px;
      color: #555;
      font-family: ui-monospace, SFMono-Regular, monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 3px;
    }
    .syn-status.error { color: #c66; }
    .syn-status.success { color: #7c7; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="syn-status" class="syn-status">Initialising…</div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
